[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whosaid"
dynamic = ["version"]
description = "Local, speaker-attributed transcription for Apple Silicon — who said what, on your Mac, nothing leaves the machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Stephen Blatt" }]
keywords = [
  "whisper",
  "transcription",
  "diarization",
  "speaker-identification",
  "mlx",
  "apple-silicon",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "mlx-whisper>=0.4",
  "mcp>=2,<3",
  "numpy>=1.26",
  "sherpa-onnx==1.13.8",
]

[project.optional-dependencies]
# `whosaid live --asr parakeet` (#235); the launcher adds it with uv on its own
parakeet = ["parakeet-mlx>=0.7,<0.8"]

[dependency-groups]
# What the offline suites import beyond the runtime deps: test/run_all.sh reads this list and runs
# every Python suite with it (#237). websockets backs the fake CDP servers in record_browser_test,
# drafts_stager_test and stager_dom_test (its sync client/server API needs >= 12).
test = [
  "numpy>=1.26",
  "mcp[cli]>=2,<3",
  "websockets>=12",
]

[project.urls]
Homepage = "https://github.com/sblattj/whosaid"
Repository = "https://github.com/sblattj/whosaid"
Changelog = "https://github.com/sblattj/whosaid/blob/main/CHANGELOG.md"

[project.scripts]
whosaid-mcp = "whosaid.mcp_server:main"

[tool.hatch.version]
path = "lib/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.hatch.build.targets.wheel.sources]
lib = "whosaid"

[tool.uv]
managed = false
