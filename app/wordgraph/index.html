<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call topic balloons</title>
<link rel="stylesheet" href="./wordgraph.css">
<style>
  html, body { height:100%; margin:0; overflow:hidden; background:#101216; color:#eeeff3; font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wordgraph.wordgraph--full { position:fixed; inset:0; height:100%; border:0; border-radius:0; }
  .wordgraph--full > .wordgraph-balloon-viewport { height:100%; min-height:0; }
  .wordgraph-floating-hint[hidden] { display:none; }
  @media (max-width:760px) { .wordgraph-legend span:nth-of-type(n) { font-size:9px; } .wordgraph-legend span:nth-of-type(n+2):after { content:none; } .wordgraph-legend .wordgraph-shared-key { display:flex; } }
</style>
